<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Maison Menu</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <main class="app-frame">
        <aside class="left-rail">
          <div class="left-rail__brand">
            <div class="left-rail__brand-mark" aria-hidden="true">✦</div>
            <div class="left-rail__brand-copy">
              <p class="left-rail__eyebrow">Today's Kitchen</p>
              <p class="left-rail__brand-title">好好吃饭，挑一餐合心意。</p>
            </div>
          </div>
          <div class="category-stack" id="category-filters"></div>
        </aside>

        <section class="main-column">
          <header class="main-topbar">
            <div class="main-title">
              <p class="section-label">Maison Selection</p>
              <h2>今晚吃什么</h2>
              <p>挑几道想吃的，我来安排。</p>
            </div>
            <div class="main-topbar__actions">
              <label class="search-input">
                <input type="search" id="search-input" placeholder="搜索菜品、食材、口味..." />
                <button class="search-input__clear" id="clear-filters-button" type="button" aria-label="清空筛选">
                  ×
                </button>
              </label>
              <button class="button button--primary" id="add-dish-button">新建菜品</button>
            </div>
          </header>

          <section class="catalog-panel">
            <div class="catalog-head">
              <div>
                <p class="section-label">Cuisine Catalogue</p>
                <h2>菜单目录</h2>
              </div>
            </div>

            <div class="active-filters" id="active-filters"></div>
            <div class="dish-grid" id="dish-grid"></div>
          </section>
        </section>

        <aside class="right-rail">
          <section class="order-card">
            <div class="stage-card__head">
              <div>
                <p class="section-label">Live Basket</p>
                <h2>今天想吃</h2>
              </div>
              <span class="order-badge" id="cart-badge">0 道</span>
            </div>

            <div class="cart-list" id="cart-list"></div>

            <form class="order-form" id="order-form">
              <label>
                选择哪一餐
                <select name="mealSlot">
                  <option value="早餐">早餐</option>
                  <option value="午餐">午餐</option>
                  <option value="晚餐" selected>晚餐</option>
                  <option value="夜宵">夜宵</option>
                </select>
              </label>
              <label>
                备注
                <textarea name="note" rows="3" placeholder="口味偏好、忌口、想配什么主食等"></textarea>
              </label>
              <button class="button button--primary button--full" type="submit">确认下单</button>
            </form>
          </section>

          <section class="history-card" id="orders-section">
            <div class="stage-card__head">
              <div>
                <p class="section-label">Kitchen Sheet</p>
                <h2>点单表</h2>
              </div>
              <div class="stage-card__actions">
                <button class="button button--soft button--small" id="clear-orders" type="button">清空</button>
                <button class="button button--soft button--small" id="export-orders" type="button">导出</button>
              </div>
            </div>

            <div class="orders-summary" id="orders-summary"></div>
            <div class="orders-list" id="orders-list"></div>
          </section>
        </aside>
      </main>
    </div>

    <dialog class="dish-dialog" id="detail-dialog">
      <div class="dish-dialog__panel">
        <button class="dish-dialog__close" id="close-detail-dialog" type="button" aria-label="关闭详情">
          ×
        </button>
        <div id="detail-dialog-panel"></div>
      </div>
    </dialog>

    <dialog class="dish-dialog" id="editor-dialog">
      <div class="dish-dialog__panel">
        <button class="dish-dialog__close" id="close-editor-dialog" type="button" aria-label="关闭编辑">
          ×
        </button>
        <div id="editor-dialog-panel"></div>
      </div>
    </dialog>

    <template id="dish-card-template">
      <article class="dish-card">
        <button class="dish-card__media" type="button"></button>
        <div class="dish-card__body">
          <div class="dish-card__topline">
            <div class="dish-card__rating"></div>
            <button class="button button--primary button--tiny dish-add-button" type="button">+</button>
          </div>
          <h3></h3>
          <div class="dish-card__facts">
            <span class="dish-card__time"></span>
            <span class="dish-card__difficulty"></span>
            <span class="dish-card__spice"></span>
          </div>
          <div class="chip-row"></div>
          <p class="dish-card__excerpt"></p>
        </div>
      </article>
    </template>

    <template id="cart-item-template">
      <article class="cart-item">
        <div class="cart-item__thumb"></div>
        <div class="cart-item__main">
          <h3></h3>
        </div>
        <div class="cart-item__controls">
          <button type="button" class="quantity-button" data-action="decrease">-</button>
          <span class="cart-item__quantity"></span>
          <button type="button" class="quantity-button" data-action="increase">+</button>
        </div>
      </article>
    </template>

    <template id="order-item-template">
      <article class="order-item">
        <header class="order-item__header">
          <div>
            <h3></h3>
            <p class="order-item__meta"></p>
          </div>
          <span class="order-item__slot"></span>
        </header>
        <div class="order-item__dishes"></div>
        <p class="order-item__note"></p>
      </article>
    </template>

    <script src="./data.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
